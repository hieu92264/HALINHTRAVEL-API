name: halinhtravel

x-app: &app
  image: halinhtravel-api:production
  env_file:
    - .env.production
  restart: unless-stopped
  networks:
    - private
  volumes:
    - app_storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.production
      target: app

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "database", "--queue=default,realtime", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]

  nginx:
    image: halinhtravel-nginx:production
    build:
      context: .
      dockerfile: Dockerfile.production
      target: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_storage:/var/www/html/storage:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - private
    depends_on:
      - app
      - reverb
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx-bootstrap:
    image: halinhtravel-nginx:production
    profiles: ["bootstrap"]
    restart: "no"
    ports:
      - "80:80"
    volumes:
      - certbot_webroot:/var/www/certbot:ro
      - ./docker/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    env_file:
      - .env.production
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  private:
    driver: bridge

volumes:
  app_storage:
  certbot_etc:
  certbot_webroot:
  mysql_data:
  redis_data:
